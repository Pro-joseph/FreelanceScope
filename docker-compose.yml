services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancescope-app
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: freelancescope
      DB_USERNAME: freelancescope
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - freelancescope

  db:
    image: mysql:8.4
    container_name: freelancescope-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: freelancescope
      MYSQL_USER: freelancescope
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - freelancescope

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancescope-queue
    command: php artisan queue:work --tries=3
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: freelancescope
      DB_USERNAME: freelancescope
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - freelancescope

networks:
  freelancescope:
    driver: bridge

volumes:
  db_data:
