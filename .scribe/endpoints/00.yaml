        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Le mot de passe.'
        required: true
        example: password
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: john@example.com
      password: password
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "user": { "id": 1, "nom": "Doe", "prenom": "John", "email": "john@example.com", "role": "freelance", "statut": "actif" },
            "token": "2|xyz789..."
          }
        headers: []
        description: ''
