name: 'AI Estimation'
description: |-

  Génération automatique d'estimations via intelligence artificielle (Groq API).
  Le processus est asynchrone : un job est dispatché et les résultats sont disponibles
  via les endpoints Features et Estimates après exécution du worker.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/projects/{project_id}/generate-estimate'
    metadata:
      custom: []
      groupName: 'AI Estimation'
      groupDescription: |-

        Génération automatique d'estimations via intelligence artificielle (Groq API).
        Le processus est asynchrone : un job est dispatché et les résultats sont disponibles
        via les endpoints Features et Estimates après exécution du worker.
      subgroup: ''
      subgroupDescription: ''
      title: 'Générer une estimation par IA'
      description: |-
        Analyse le besoin client via l'IA et génère automatiquement les fonctionnalités et leurs estimations.
        Nécessite que le worker queue soit actif : `php artisan queue:work`.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      project_id:
        custom: []
        name: project_id
        description: 'The ID of the project.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      project:
        custom: []
        name: project
        description: "L'ID du projet."
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      project_id: 1
      project: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      prompt:
        custom: []
        name: prompt
        description: 'La description détaillée du projet.'
        required: true
        example: 'Je veux un site e-commerce complet avec catalogue produits, panier, paiement Stripe, dashboard admin, et espace client.'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      prompt: 'Je veux un site e-commerce complet avec catalogue produits, panier, paiement Stripe, dashboard admin, et espace client.'
    fileParameters: []
    responses:
      -
        custom: []
        status: 202
        content: |-
          {
            "message": "Estimation en cours de génération."
          }
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 1|scribe-test-token'
    controller: null
    method: null
    route: null
